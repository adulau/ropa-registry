{% extends 'base.html' %}{% block content %}<h1>Organisations</h1><div class="grid two"><form method="post" class="card form-stack"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><h2>Create organisation</h2><label>Name<input name="name" required></label><button class="primary">Create</button></form><div class="card"><h2>Existing</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>UUID</th></tr></thead><tbody>{% for o in organisations %}<tr><td>{{ o['name'] }}</td><td class="uuid">{{ o['uuid'] }}</td></tr>{% else %}<tr><td colspan="2">None</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
