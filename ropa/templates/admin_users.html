{% extends 'base.html' %}{% block content %}<h1>Users</h1><div class="card"><form method="post" class="form-stack"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="grid two"><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><label>Role<select name="role"><option value="manager">Manager</option><option value="viewer">Viewer</option><option value="admin">Admin</option></select></label><label>Organisation<select name="organisation_id"><option value="">None</option>{% for o in organisations %}<option value="{{ o['id'] }}">{{ o['name'] }}</option>{% endfor %}</select></label><label>Department<select name="department_id"><option value="">None / whole organisation</option>{% for d in departments %}<option value="{{ d['id'] }}">{{ d['organisation_name'] }} / {{ d['name'] }}</option>{% endfor %}</select></label></div><button class="primary">Create user</button></form></div><div class="card table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Scope</th><th>Active</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u['username'] }}</td><td>{{ u['role'] }}</td><td>{{ u['organisation_name'] or 'All' }}{% if u['department_name'] %} / {{ u['department_name'] }}{% endif %}</td><td>{{ 'yes' if u['active'] else 'no' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
