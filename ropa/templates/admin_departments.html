{% extends 'base.html' %}{% block content %}<h1>Departments</h1><div class="grid two"><form method="post" class="card form-stack"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><h2>Create department</h2><label>Organisation<select name="organisation_id" required>{% for o in organisations %}<option value="{{ o['id'] }}">{{ o['name'] }}</option>{% endfor %}</select></label><label>Name<input name="name" required></label><button class="primary">Create</button></form><div class="card"><h2>Existing</h2><table><thead><tr><th>Organisation</th><th>Department</th></tr></thead><tbody>{% for d in departments %}<tr><td>{{ d['organisation_name'] }}</td><td>{{ d['name'] }}</td></tr>{% else %}<tr><td colspan="2">None</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
